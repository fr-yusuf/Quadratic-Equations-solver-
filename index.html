        <div class="inputs">
            <label class="field">
                <input type="number" id="a" placeholder=" " step="any" aria-label="Coefficient a">
                <span>a</span>
            </label>
            <label class="field">
                <input type="number" id="b" placeholder=" " step="any" aria-label="Coefficient b">
                <span>b</span>
            </label>
            <label class="field">
                <input type="number" id="c" placeholder=" " step="any" aria-label="Coefficient c">
                <span>c</span>
            </label>
        </div>

        <div class="btn-row">
            <button type="button" id="solveBtn" class="btn" data-ripple>Solve</button>
            <button type="button" id="resetBtn" class="btn" data-ripple>Reset</button>
        </div>

        <div id="message" class="message" role="alert" hidden></div>

        <div id="output" aria-live="polite" hidden>
            <div id="roots" class="roots"></div>
            <div id="info" class="info-grid"></div>
            <div id="graphWrap" class="graph-wrap" hidden>
                <canvas id="graph"></canvas>
                <div id="legend" class="legend"></div>
            </div>
            <details class="steps">
                <summary data-ripple>Step-by-step solution</summary>
                <ol id="steps"></ol>
