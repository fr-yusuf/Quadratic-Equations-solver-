<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Quadratic Solver</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#595E48">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Quadratic">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="tab">
        <header class="hero">
            <div class="badge" aria-hidden="true">x²</div>
            <h2>Quadratic Equation Solver</h2>
        </header>
        <p class="format">Equation format: <strong>ax² + bx + c = 0</strong></p>

        <div class="inputs">
            <label class="field">
                <input type="number" id="a" placeholder=" " step="any" aria-label="Coefficient a">
                <span>a</span>
            </label>
            <label class="field">
                <input type="number" id="b" placeholder=" " step="any" aria-label="Coefficient b">
                <span>b</span>
            </label>
            <label class="field">
                <input type="number" id="c" placeholder=" " step="any" aria-label="Coefficient c">
                <span>c</span>
            </label>
        </div>

        <div class="btn-row">
            <button type="button" id="solveBtn">Solve</button>
            <button type="button" id="resetBtn">Reset</button>
        </div>

        <div id="message" class="message" role="alert" hidden></div>

        <div id="output" aria-live="polite" hidden>
            <div id="roots" class="roots"></div>
            <div id="info" class="info-grid"></div>
            <div id="graphWrap" class="graph-wrap" hidden>
                <canvas id="graph"></canvas>
                <div id="legend" class="legend"></div>
            </div>
            <details class="steps">
                <summary>Step-by-step solution</summary>
                <ol id="steps"></ol>
            </details>
        </div>
    </div>

    <footer class="insta-footer">
        <a class="insta-btn" href="https://instagram.com/vxyr_ix" target="_blank" rel="noopener">vxyr_ix</a>
    </footer>

    <script src="script.js"></script>

</body>
</html>
